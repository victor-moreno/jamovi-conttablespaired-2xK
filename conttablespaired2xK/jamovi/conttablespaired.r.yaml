---
name:  contTablesPaired
title: Paired Samples Contingency Tables
jrs: '1.0'

items:
    - name: freqs
      title: Contingency Tables
      type: Table
      description: a table of frequencies and percentages
      columns: [ ]
      clearWith:
        - rows
        - cols
        - counts

    - name: test
      title: Paired Tests
      type: Table
      description: a table of test results
      clearWith:
        - rows
        - cols
        - counts

      columns:
        - name: name[mcn]
          title: ''
          type: 'text'
          content: McNemar χ²
          visible: (chiSq)

        - name: value[mcn]
          title: Value
          visible: (chiSq)

        - name: df[mcn]
          title: df
          type: integer
          visible: (chiSq)

        - name: p[mcn]
          title: p
          type: number
          format: zto,pvalue
          visible: (chiSq)

        - name: name[cor]
          title: ''
          type: 'text'
          content: McNemar χ² continuity correction
          visible: (chiSqCorr)

        - name: value[cor]
          title: Value
          visible: (chiSqCorr)

        - name: df[cor]
          title: df
          type: integer
          visible: (chiSqCorr)

        - name: p[cor]
          title: p
          type: number
          format: zto,pvalue
          visible: (chiSqCorr)

        - name: name[bin]
          title: ''
          type: 'text'
          content: Exact test (binomial)
          visible: (exactBinom)

        - name: value[bin]
          title: Value
          visible: (exactBinom)

        - name: df[bin]
          title: df
          content: ''
          visible: (exactBinom)

        - name: p[bin]
          title: p
          type: number
          format: zto,pvalue
          visible: (exactBinom)

        - name: name[bow]
          title: ''
          type: 'text'
          content: Bowker's test of symmetry
          visible: (symmetry)
          refs: bowker1948

        - name: value[bow]
          title: Value
          visible: (symmetry)

        - name: df[bow]
          title: df
          type: integer
          visible: (symmetry)

        - name: p[bow]
          title: p
          type: number
          format: zto,pvalue
          visible: (symmetry)

        - name: name[sm]
          title: ''
          type: 'text'
          content: Stuart-Maxwell test of marginal homogeneity
          visible: (margHom)
          refs: stuart1955

        - name: value[sm]
          title: Value
          visible: (margHom)

        - name: df[sm]
          title: df
          type: integer
          visible: (margHom)

        - name: p[sm]
          title: p
          type: number
          format: zto,pvalue
          visible: (margHom)

        - name: name[n]
          title: ''
          type: 'text'
          content: N

        - name: value[n]
          title: Value

        - name: df[n]
          title: df
          content: ''

        - name: p[n]
          title: p
          content: ''

    - name: odds
      title: Comparative Measures
      type: Table
      description: a table of comparative measures (2x2 tables only)
      visible: (oddsRatio || oddsExact || diffProp)

      clearWith:
        - rows
        - cols
        - counts
        - ciWidth

      columns:
        - name: t[dp]
          title: ''
          type: text
          content: Difference in proportions
          visible: (diffProp)

        - name: v[dp]
          title: Value
          visible: (diffProp)

        - name: cil[dp]
          title: Lower
          superTitle: Confidence Intervals
          visible: (diffProp && ci)

        - name: ciu[dp]
          title: Upper
          superTitle: Confidence Intervals
          visible: (diffProp && ci)

        - name: t[o]
          title: ''
          type: text
          content: Odds ratio
          visible: (oddsRatio)

        - name: v[o]
          title: Value
          visible: (oddsRatio)

        - name: cil[o]
          title: Lower
          superTitle: Confidence Intervals
          visible: (oddsRatio && ci)

        - name: ciu[o]
          title: Upper
          superTitle: Confidence Intervals
          visible: (oddsRatio && ci)

        - name: t[oe]
          title: ''
          type: text
          content: Exact odds ratio
          visible: (oddsExact)
          refs: exact2x2

        - name: v[oe]
          title: Value
          visible: (oddsExact)

        - name: cil[oe]
          title: Lower
          superTitle: Confidence Intervals
          visible: (oddsExact && ci)

        - name: ciu[oe]
          title: Upper
          superTitle: Confidence Intervals
          visible: (oddsExact && ci)

    - name: agree
      title: Agreement
      type: Table
      description: a table of agreement measures
      visible: (agreement || kappa || kappaWeighted)

      clearWith:
        - rows
        - cols
        - counts
        - ciWidth

      columns:
        - name: t[obs]
          title: ''
          type: text
          content: Observed agreement
          visible: (agreement)

        - name: v[obs]
          title: Value
          visible: (agreement)

        - name: cil[obs]
          title: Lower
          superTitle: Confidence Intervals
          visible: (agreement && ci)

        - name: ciu[obs]
          title: Upper
          superTitle: Confidence Intervals
          visible: (agreement && ci)

        - name: t[kap]
          title: ''
          type: text
          content: Cohen's kappa
          visible: (kappa)
          refs: [ vcd, mchugh2012 ]

        - name: v[kap]
          title: Value
          visible: (kappa)

        - name: cil[kap]
          title: Lower
          superTitle: Confidence Intervals
          visible: (kappa && ci)

        - name: ciu[kap]
          title: Upper
          superTitle: Confidence Intervals
          visible: (kappa && ci)

        - name: t[wkap]
          title: ''
          type: text
          content: Weighted kappa
          visible: (kappaWeighted)
          refs: [ vcd, cohen1968 ]

        - name: v[wkap]
          title: Value
          visible: (kappaWeighted)

        - name: cil[wkap]
          title: Lower
          superTitle: Confidence Intervals
          visible: (kappaWeighted && ci)

        - name: ciu[wkap]
          title: Upper
          superTitle: Confidence Intervals
          visible: (kappaWeighted && ci)
